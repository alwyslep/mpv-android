name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        run: |
          buildscripts/include/ci.sh build

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android
          path: app/build/outputs/apk/default/debug/*.apk

      # arm64 APK 를 롤링 Release 자산으로 publish — Actions 아티팩트(Azure ~300KB/s)
      # 대신 Release(objects.githubusercontent/Fastly ~1.5MB/s)에서 받아 다운로드 가속.
      - name: Publish arm64 APK to rolling release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-${GITHUB_REF_NAME}"
          APK=$(find app/build/outputs/apk -name '*arm64-v8a-debug.apk' | head -1)
          echo "publishing $APK to release $TAG"
          gh release create "$TAG" \
            --title "CI build: ${GITHUB_REF_NAME}" \
            --notes "rolling latest build (arm64 debug)" \
            --prerelease 2>/dev/null || true
          gh release upload "$TAG" "$APK" --clobber
