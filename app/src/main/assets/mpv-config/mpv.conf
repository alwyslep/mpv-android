# ============================================================
# mpv-android config — Soul Edition v3 (slim)
# Target: Galaxy Fold7 + DeX 3440x1440
#
# 거버넌스 원칙:
#   - mpv-android GUI에서 노출하는 옵션은 conf에서 강제하지 않는다.
#     (gpu-next, Hardware decoding, Save position, Upscaling/
#      Downscaling filter, Debanding, Interpolation, Audio/Sub
#      language, Screen orientation, Show controls 등 → 모두 GUI)
#   - conf는 GUI에 없는 고급 옵션만 다룬다:
#     스크립트 로드, 캐시, 자막 매칭/스타일, OSD 스타일,
#     스크린샷, 프로파일.
#
# 설치: 앱 → Settings → Advanced → Edit mpv.conf
#       이 파일 전체 내용을 거기에 붙여넣기
# ============================================================

# ============================================================
# 1) Lua 스크립트 로드 (mpv-android는 scripts/ 자동 로드 안 함)
# ============================================================
# 변경 후 — 9줄, 매니저가 첫 번째
script=/storage/emulated/0/mpv/scripts/_soul_manager.lua
script=/storage/emulated/0/mpv/scripts/jav_osd.lua
script=/storage/emulated/0/mpv/scripts/precise_speed.lua
script=/storage/emulated/0/mpv/scripts/bookmarks.lua
script=/storage/emulated/0/mpv/scripts/sub_style_toggle.lua
script=/storage/emulated/0/mpv/scripts/multiwindow_fix.lua
script=/storage/emulated/0/mpv/scripts/screenshot_to_clip.lua
script=/storage/emulated/0/mpv/scripts/progress_bar.lua

# ── 2026-06-01 비활성: 포크 앱(alwyslep/mpv-android, p1-launcher)이 라이브러리
#    레이어에 네이티브로 구현 → Lua(플레이어 레이어)와 중복/충돌. SSOT:
#    player_meta_translation.md §1.6. 되살리려면 아래 3줄 주석 해제.
#  favorite.lua    → 네이티브 Favorites(prefs favorites_v1·uri키·뱃지·찜필터·hub연동)
#  playstats.lua   → 네이티브 Progress/watchStatus(이어보기·시청상태·진행바)
#  prev_next_file  → 네이티브 autoplay_next. ⚠충돌: EOF 인-플레이어 loadfile 이
#                    라이브러리 복귀(for-result)를 우회 → 네이티브 진행률/트랙기억 기록을 깸.
#script=/storage/emulated/0/mpv/scripts/favorite.lua
#script=/storage/emulated/0/mpv/scripts/playstats.lua
#script=/storage/emulated/0/mpv/scripts/prev_next_file.lua

# 외부 Lua 추가 시 같은 형식:
#script=/storage/emulated/0/mpv/scripts/autoload.lua
#script=/storage/emulated/0/mpv/scripts/sub-select.lua
#script=/storage/emulated/0/mpv/scripts/modernx.lua

# ============================================================
# 1-B) 비디오 출력 백엔드 (GUI에 없는 항목만)
# ============================================================
# gpu-next(libplacebo)는 GUI 토글로 ON. 그 백엔드만 여기서 지정.
# OpenGL 경로의 aimagereader -30001 회피 → Vulkan으로.
gpu-api=vulkan
swapchain-depth=2
vulkan-swap-mode=fifo

# ============================================================
# 2) 캐시 (SMB/NAS 스트리밍 대비)
# ============================================================
cache=yes
cache-secs=120
demuxer-max-bytes=200MiB
demuxer-max-back-bytes=100MiB
demuxer-readahead-secs=20

# ============================================================
# 3) 오디오 보조 (메인 출력은 mpv-android 기본 — opensles/aaudio/audiotrack)
# ============================================================
volume-max=200
audio-pitch-correction=yes
audio-file-auto=fuzzy
audio-file-paths=audio
audio-buffer=0.5

# ============================================================
# 4) 자막 자동 매칭 (품번 매칭)
# ============================================================
sub-auto=fuzzy
sub-file-paths=subs;/storage/emulated/0/mpv/subs
# 다중 자막 언어 우선순위 (GUI는 단일 언어만 받으므로 conf로 보충)
slang=ko,kor,jp,jpn,ja,en,eng
alang=ja,jpn,ko,kor,en,eng

# ============================================================
# 5) 자막 스타일 (GUI에 없음 — 기본 프리셋, F1로 sub_style_toggle.lua 사이클)
# ============================================================
sub-font=Pretendard
sub-font-size=42
sub-color=#FFFFFFFF
sub-border-color=#FF000000
sub-border-size=2.5
sub-shadow-color=#80000000
sub-shadow-offset=1
sub-spacing=0
sub-margin-y=80
sub-ass-override=force

# ============================================================
# 6) OSD 스타일 (GUI에 없음)
# ============================================================
osd-font=Pretendard
osd-font-size=32
osd-color=#FFFFFFFF
osd-border-color=#FF000000
osd-border-size=2
osd-shadow-offset=1
osd-bar=no
osd-bar-align-y=0.92
osd-duration=500
osd-fractions=yes
# 내장 OSC(하단 컨트롤러/시크바) 끄기 — 진행바는 progress_bar.lua로 일원화
osc=no

# ============================================================
# 7) 스크린샷
# ============================================================
screenshot-format=png
screenshot-png-compression=3
screenshot-directory=/storage/emulated/0/Pictures/mpv
screenshot-template=%F_%P_%n

# ============================================================
# 8) 재생 보조 (GUI에 없는 항목만)
# ============================================================
prefetch-playlist=yes
force-seekable=yes
hr-seek=yes
hr-seek-framedrop=no
keep-open=yes
keep-open-pause=no
# save-position-on-quit, watch-later-options → GUI "Save position on quit"에 위임

# ============================================================
# 9) 프로파일 — DeX/폰 OSD·자막 크기 자동 보정
#    (GUI Upscaling/Downscaling filter는 conf에서 손대지 않음)
# ============================================================
[dex-external]
profile-cond=get("osd-width") > 2560
profile-restore=copy-equal
sub-font-size=46
osd-font-size=36

[phone-internal]
profile-cond=get("osd-width") <= 2560
profile-restore=copy-equal
sub-font-size=36
osd-font-size=28

# ============================================================
# 로그
# ============================================================
# msg-level 라인 의도적으로 없음.
# mpv-android는 cplayer=false 빌드라 콘솔 없음 → warn/error가 OSD로 풀려나옴.
# 디버그 필요 시에만 일시적으로 추가:
#   msg-level=all=warn,jav=info,bookmarks=info,sub_style=info,mwfix=info,scrclip=info
# 끝나면 다시 주석.
