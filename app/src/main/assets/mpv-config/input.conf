# ============================================================
# input.conf — Soul Edition v3
# DeX: 키보드 + 마우스(휠/우클릭) 가정. 폰 터치는 안드로이드 OSC가 처리.
# ============================================================

# ---- 재생 제어 ----
SPACE       cycle pause
k           cycle pause
ENTER       cycle pause
MBTN_LEFT   cycle pause
MBTN_LEFT_DBL cycle fullscreen
MBTN_MID    cycle mute

# ---- 시킹 ----
RIGHT       seek  5  exact
LEFT        seek -5  exact
Ctrl+RIGHT  seek  60 exact
Ctrl+LEFT   seek -60 exact
Shift+RIGHT seek  10  exact
Shift+LEFT  seek -10  exact
.           frame-step
,           frame-back-step

# ---- 마우스 휠 ----
WHEEL_UP         seek  10 exact
WHEEL_DOWN       seek -10 exact
Shift+WHEEL_UP   add volume  5
Shift+WHEEL_DOWN add volume -5
Ctrl+WHEEL_UP    add sub-scale  0.05
Ctrl+WHEEL_DOWN  add sub-scale -0.05

# ---- 볼륨 ----
9           add volume -2
0           add volume  2
m           cycle mute

# ---- 배속 (정밀 — precise_speed.lua, 0.05 단위) ----
[           script-message precise-speed-down
]           script-message precise-speed-up
BS          script-message precise-speed-reset
{           multiply speed 0.5
}           multiply speed 2.0
Shift+BS    set speed 1.0

# ---- 1x/4x 토글 (단일키) ----
\        cycle-values speed 1.0 4.0


# ---- 자막 ----
j           cycle sub
J           cycle sub down
v           cycle sub-visibility
z           add sub-delay -0.1
Z           add sub-delay  0.1
Shift+z     set sub-delay 0
F1          script-message sub-style-cycle

# 자막 위치/크기
Alt+UP      add sub-pos -1
Alt+DOWN    add sub-pos  1
Ctrl+UP     add sub-scale  0.05
Ctrl+DOWN   add sub-scale -0.05

# ---- 오디오 트랙 ----
a           cycle audio
Shift+a     cycle audio down

# ---- 화면 ----
f           cycle fullscreen
ESC         set fullscreen no
TAB         cycle ontop

# 색 보정
1           add contrast   -1
2           add contrast    1
3           add brightness -1
4           add brightness  1
5           add gamma      -1
6           add gamma       1
7           add saturation -1
8           add saturation  1
Alt+0       set contrast 0; set brightness 0; set gamma 0; set saturation 0

# 줌 / 팬 (DeX 마우스로 디테일 확인용)
Ctrl+=      add video-zoom  0.1
Ctrl+-      add video-zoom -0.1
Ctrl+0      set video-zoom 0; set video-pan-x 0; set video-pan-y 0

# 화면 비율 강제
Alt+1       set video-aspect-override "-1"
Alt+2       set video-aspect-override "16:9"
Alt+3       set video-aspect-override "21:9"
Alt+4       set video-aspect-override "4:3"

# 회전
Alt+r       cycle-values video-rotate 0 90 180 270

# ---- A-B 루프 ----
l           ab-loop
L           set ab-loop-a no; set ab-loop-b no

# ---- 스크린샷 ----
s           script-message screenshot-clip-take
S           screenshot video
Ctrl+s      screenshot window

# ---- 책갈피 (bookmarks.lua) ----
b           script-message bookmark-add
B           script-message bookmark-list
Ctrl+b      script-message bookmark-remove-last
Alt+b       script-message bookmark-clear
'           script-message bookmark-prev
;           script-message bookmark-next

# ---- JAV OSD (jav_osd.lua) ----
i           script-message jav-osd-show
I           script-message jav-osd-toggle-persistent
Ctrl+c      script-message jav-copy-code
Ctrl+Shift+c script-message jav-copy-meta

# ---- 정보 / 통계 ----
o           show-progress
Shift+o     cycle-values osd-level 3 1
`           script-binding console/enable
MBTN_RIGHT  script-binding stats/display-stats-toggle
F10      script-message soul-status
F12      script-message soul-cheatsheet

# ---- 영상 점프 (같은 폴더) ----
# PgDn = 다음 영상, PgUp = 이전 영상
PGUP     script-message prev-video
PGDWN    script-message next-video

# ---- 플레이리스트 ----
>           playlist-next
<           playlist-prev
F8          show-text "${playlist}" 4000
F9          playlist-shuffle

# ---- mpv-aurora 자체 기능 (aurora_bridge.lua → 네이티브) ----
t           script-message aurora-thumb     # 현재 장면을 라이브러리 썸네일로(커버 없는 영상)
Ctrl+l      script-message aurora-lock       # 화면 잠금 토글(오작동 방지)
p           script-message aurora-pip        # 작은 창(PiP)
n           script-message aurora-menu       # 더보기 메뉴

# ---- 종료 ----
q           quit
Q           quit-watch-later
Ctrl+q      quit